name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Test dependencies
        run: npm ci --ignore-scripts
        working-directory: app
      - name: Application tests
        run: node app/tests/run.cjs
      - name: Integration fixtures
        run: node rooting/tests/run.cjs
      - name: Diagnostic parser tests
        run: python3 .github/scripts/test_parse_log.py
      - name: Release hygiene and architecture
        run: python3 .github/scripts/audit_release.py
