name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Application tests
        run: node app/tests/run.cjs
      - name: Integration fixtures
        run: node rooting/tests/run.cjs
      - name: Diagnostic parser tests
        run: python3 .github/scripts/test_parse_log.py
      - name: Release hygiene and architecture
        run: python3 .github/scripts/audit_release.py
  launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Launcher tests
        run: dotnet run --project dock/tests/Launcher.Tests.csproj --configuration Release
      - name: Install Ecore test runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libecore1
      - name: Native Ecore process and repeated Home tests
        env:
          ECORE_NO_SYSTEM_MODULES: '1'
        run: dotnet run --project dock/native-tests/Launcher.NativeTests.csproj --configuration Release
      - name: Compile TV launcher
        run: dotnet build dock/Launcher.csproj --configuration Release -p:UseAppHost=false
      - name: Headless launcher control and privilege boundary
        run: sudo env DOTNET_ROLL_FORWARD=Major python3 dock/control-tests/test_control.py "$(command -v dotnet)" dock/bin/Release/netcoreapp3.1/tvlauncher-dotnet.dll
