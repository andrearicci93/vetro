<head>

<title>Vetro Velo Six</title>
<style>
/* =====================================================================================================================
 * opus6: il "Velo" di opus3-real, con il Banner nell'angolo e lo stesso linguaggio su Dock, Task manager, Volume, pad, lista, toast.
 * Regola del mock (come opus3-real): ogni primitiva è UN elemento = UN evas_object. div con colore+alpha (rectangle), img o 9-slice via
 * border-image (= evas_object_image_border_set; border-width più piccolo dello slice = evas_object_image_border_scale_set), testo con un font,
 * una dimensione e un colore (evas_object_text). Un'immagine "tinta" (mask-image + background-color) è una PNG bianca con
 * evas_object_color_set: è l'unico uso di mask nel mock. Niente filtri, ombre CSS, pseudo-elementi, transizioni CSS, letter-spacing.
 * I contenitori .layer e .clip sono rettangoli di clip (Surface) e si contano. #video simula il piano hardware: non è UI.
 *
 * Token (blocco :root qui sotto, solo documentazione: il codice li legge dalle costanti JS in cima allo script)
 * :root {
 *   --velo-ink:        #111b2a;   velo, uno solo, cotto in assets/veil9.png (era veil.png 4x284, fascia)
 *   --velo-fade:       288px;     bordo morbido delle forme grandi (era 220, solo in alto); 72px nei pannelli (border_scale .25)
 *   --velo-a:          .84;       Banner, Info, Channel pad, lista, Dock, pad, volume, toast, task manager
 *   --velo-a-full:     .94;       EPG
 *   --ink-main: 1; --ink-muted: .76; --ink-faint: .64;   bianco: testo, secondario, spento (invariati)
 *   --luce:            #a5d8ff;   avanzamento, testina, "adesso", app in uso (nuovo: segno sotto l'icona)
 *   --ghiaccio:        #e4f2ff;   solo l'anello del fuoco (EPG, pad, lista, task manager, Dock: icon_ring.png)
 *   --num-weight:      200;       numero grande: Banner 128 (era 136), Info 64 (era 72), Channel pad 128, 123 68, volume 48
 *   --safe-x: 96px; --safe-y: 54px;
 *   --motion: 320ms velo e morph, 220ms fuoco e zap, 200ms entrate/uscite; tutto lineare a segmenti (EASE 3 segmenti, IN 2)
 * }
 * ===================================================================================================================== */
@font-face { font-family: "SamsungOneUI 200"; src: url(assets/SamsungOneUI-200.ttf); }
@font-face { font-family: "SamsungOneUI 500"; src: url(assets/SamsungOneUI-500.ttf); }
@font-face { font-family: "SamsungOneUI 600"; src: url(assets/SamsungOneUI-600.ttf); }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #04060b; color: #dfe7f5; font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
#bar { position: fixed; inset: 0 0 auto 0; min-height: 52px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 14px; background: #0b1120; border-bottom: 1px solid #1d2840; z-index: 10; }
#bar b { font-weight: 600; color: #fff; margin-right: 4px; }
#bar .grp { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
#bar .lbl { color: #8796b3; margin-right: 2px; }
#bar button, #bar select { font: inherit; color: #dfe7f5; background: #141d31; border: 1px solid #263452; border-radius: 7px; padding: 5px 9px; cursor: pointer; }
#bar button[aria-pressed="true"] { background: #123bb5; border-color: #1674fb; color: #fff; }
#bar .chname { min-width: 150px; color: #fff; }
#bar label { display: flex; gap: 5px; align-items: center; color: #aab8d1; cursor: pointer; }
#wrap { position: fixed; inset: 92px 0 0 0; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #000; }
body.shot #bar { display: none; }
body.shot #wrap { inset: 0; }
#counter { position: fixed; right: 14px; bottom: 14px; z-index: 20; display: none; background: rgba(8, 12, 22, .92); border: 1px solid #2a3858; border-radius: 10px; padding: 10px 14px; font: 13px/1.5 ui-monospace, SFMono-Regular, monospace; color: #dfe7f5; white-space: pre; }
body.count #counter { display: block; }
#counts, #selftest { display: none; }
/* l'alone dei testi di Banner e Info = UN filter program del testo (evas_object_text_filter_program_set: blur 10 nero .55, poi l'ombra di 1 px e il testo).
   In DESIGN.md i text filter program sono misurati sulla Q80A: 2,2 ms, "the cheapest way to make a label legible on video". */
#L-banner .t, #L-info .t { text-shadow: 0 0 10px rgba(0, 0, 0, .55), 0 1px 2px rgba(0, 0, 0, .45); }
#help { position: fixed; left: 14px; bottom: 14px; z-index: 20; color: #8796b3; font-size: 12px; }
body.shot #help { display: none; }

/* --------- il "video": piano hardware simulato (gradienti CSS solo qui) --------- */
/* --------- il "video": piano hardware simulato (gradienti CSS solo qui) --------- */
#video { position: absolute; inset: -48px; }
#video .vl { position: absolute; inset: 0; }
#video .drift { animation: drift 26s ease-in-out infinite alternate; }
@keyframes drift { from { transform: translate3d(-18px, 6px, 0) scale(1.02); } to { transform: translate3d(22px, -10px, 0) scale(1.05); } }
body.still #video .drift { animation: none; }
@media (prefers-reduced-motion: reduce) { #video .drift { animation: none; } }
[data-bg="night"] #video .base { background: radial-gradient(120% 80% at 50% 110%, #1a1410 0%, transparent 60%), linear-gradient(180deg, #0a1124 0%, #0d1730 45%, #161320 100%); }
[data-bg="night"] #video .drift { background:
  radial-gradient(9% 12% at 22% 36%, rgba(255, 196, 120, .55), transparent 70%), radial-gradient(5% 7% at 31% 30%, rgba(255, 230, 170, .5), transparent 70%),
  radial-gradient(14% 18% at 70% 28%, rgba(255, 150, 70, .45), transparent 70%), radial-gradient(7% 10% at 82% 44%, rgba(120, 170, 255, .55), transparent 70%),
  radial-gradient(6% 9% at 58% 52%, rgba(255, 90, 120, .40), transparent 70%), radial-gradient(10% 14% at 12% 62%, rgba(90, 140, 255, .40), transparent 70%),
  radial-gradient(40% 18% at 50% 82%, rgba(255, 170, 80, .22), transparent 70%), radial-gradient(4% 6% at 44% 22%, rgba(255, 255, 255, .55), transparent 70%); }
[data-bg="snow"] #video .base { background: linear-gradient(180deg, #bcd3ee 0%, #e6eef7 38%, #f7f9fb 58%, #eef2f6 100%); }
[data-bg="snow"] #video .drift { background:
  radial-gradient(30% 22% at 78% 14%, rgba(255, 246, 220, .95), transparent 70%), radial-gradient(60% 18% at 30% 58%, rgba(255, 255, 255, .9), transparent 70%),
  radial-gradient(50% 30% at 20% 46%, rgba(170, 190, 215, .45), transparent 70%), radial-gradient(40% 22% at 80% 70%, rgba(200, 215, 235, .55), transparent 70%),
  linear-gradient(170deg, transparent 54%, rgba(120, 140, 170, .25) 55%, transparent 64%); }
[data-bg="pitch"] #video .base { background: linear-gradient(180deg, #0b1424 0%, #1b2536 22%, transparent 34%), repeating-linear-gradient(90deg, #2f8a3b 0 160px, #2a7d35 160px 320px), #2f8a3b; }
[data-bg="pitch"] #video .drift { background:
  radial-gradient(18% 14% at 18% 8%, rgba(255, 255, 240, .85), transparent 70%), radial-gradient(18% 14% at 82% 8%, rgba(255, 255, 240, .85), transparent 70%),
  linear-gradient(176deg, transparent 47%, rgba(255, 255, 255, .55) 47.3%, transparent 47.7%), radial-gradient(9% 16% at 50% 62%, transparent 92%, rgba(255, 255, 255, .5) 93%, transparent 96%),
  radial-gradient(1.4% 2.4% at 61% 56%, #f3f3f3 60%, transparent 70%), radial-gradient(2% 4% at 40% 50%, #d62d3a 60%, transparent 70%), radial-gradient(2% 4% at 66% 64%, #1f4bd8 60%, transparent 70%); }
[data-bg="concert"] #video .base { background: radial-gradient(60% 40% at 50% 100%, #3a0f3a 0%, transparent 70%), linear-gradient(180deg, #08030f, #160822 60%, #23091f); }
[data-bg="concert"] #video .drift { background:
  linear-gradient(115deg, transparent 30%, rgba(255, 60, 170, .45) 38%, transparent 46%), linear-gradient(65deg, transparent 48%, rgba(255, 150, 40, .45) 55%, transparent 62%),
  linear-gradient(95deg, transparent 60%, rgba(90, 120, 255, .40) 66%, transparent 72%), radial-gradient(30% 16% at 50% 76%, rgba(255, 120, 60, .55), transparent 70%),
  radial-gradient(8% 10% at 30% 18%, rgba(255, 255, 255, .7), transparent 70%), radial-gradient(8% 10% at 72% 16%, rgba(255, 255, 255, .7), transparent 70%); }
[data-bg="black"] #video .base, [data-bg="black"] #video .drift { background: #000; }


/* --------- primitive EFL: tutte posizionate in assoluto, nient'altro --------- */
.p { position: absolute; left: 0; top: 0; }
.layer, .clip { position: absolute; overflow: hidden; }          /* = evas_object_clip_set su un rettangolo */
.layer { left: 0; top: 0; width: 1920px; height: 1080px; visibility: hidden; }
.layer.on { visibility: visible; }
.t { white-space: pre; line-height: 1; color: #fff; }               /* evas_object_text: un font, una dimensione, un colore */
img.p { display: block; }
</style>

<body>
<div id="bar">
  <b>Vetro · Velo 6</b>
  <div class="grp" id="tabs">
    <button data-go="banner">1 Banner</button><button data-go="info">2 Info</button><button data-go="epg">3 EPG</button>
    <button data-go="dock">4 Dock</button><button data-go="sources">Sources</button><button data-go="tasks">5 Task manager</button><button data-go="volume">6 Volume</button>

  <label title="the old OSD as it is on the TV today, without the round-6 refinement"><input type="checkbox" id="today"> Today's OSD</label>

</div>
<div id="wrap"><div id="stage" data-bg="night">
  <div id="video"><div class="vl base"></div><div class="vl drift"></div></div>
</div></div>
<div id="counter"></div>
<div id="counts"></div>
<div id="selftest"></div>
<div id="help">Keys: 1-9 0 screens · arrows, OK (Enter), Back (Esc) · PageUp/PageDown CH± · + − M volume · B video · O objects · digits in the pads</div>
<script>
(function () {

var Q = new URLSearchParams(location.search), FROZEN = false;

};
var LOGO_BASE = 'https://round-logo.samsungnyc.com/round?idx=89&url=http://eden-prod-images.s3.amazonaws.com/processed/gvd/';
var LOGOS = {
  'Rai Sport HD': 'sung.tmsimg.com/assets/assets/s54777_ll_h8_aa.png', 'La 5 HD': 'sung.tmsimg.com/assets/assets/s75500_ll_h8_aa.png',
  'Iris HD': 'sung.tmsimg.com/assets/assets/s84621_ll_h10_aa.png', 'Giallo': 'sung.tmsimg.com/assets/assets/s84614_ll_h10_aa.png',
  'Canale Italia 83': 'sung.tmsimg.com/assets/assets/s84781_ll_h10_aa.png', 'Radio Italia TV HD': 'sung.tmsimg.com/assets/assets/s100855_ll_h8_ac.png',
  'TV8': 'sung.tmsimg.com/assets/assets/s84652_ll_h8_aa.png', 'Virgin Radio': 'akamai-b.cdn.cddbp.net/cds/2.0/image/DB2F/DFC1/B64E/24EF_220.png',
  'Lombardia TV': 'akamai-b.cdn.cddbp.net/cds/2.0/image/7D90/A49D/9F95/C12E_220.png', 'Italia 159': 'akamai-b.cdn.cddbp.net/cds/2.0/image/572E/2643/F1B4/7FAB_220.png',
  '20': 'sung.tmsimg.com/assets/assets/s108194_ll_h10_af.png', 'SuperTV': 'akamai-b.cdn.cddbp.net/cds/2.0/image/B699/A82A/B0A5/97F8_220.png',

};
var CH = NAMES.map(function (n, i) { return { id: 1001 + i, num: i + 1, name: n, logo: LOGOS[n] ? LOGO_BASE + LOGOS[n] : null }; });
var tq = /^(\d\d):(\d\d)$/.exec(Q.get('t') || '');
var NOW = Math.floor(new Date(2026, 10, 11, tq ? +tq[1] : 21, tq ? +tq[2] : 20, 0).getTime() / 1000);
var S = { mode: 'none', ch: 1, bg: 'night', state: 'ok', timers: false };
function slot(id) { return 1800 + (id % 3) * 900; }

function noData(c) { return S.state === 'nodata' && c.num === 14; }

function events(c, from, to) {

  var sl = slot(c.id), out = [];
  for (var t = from - (from % sl); t < to; t += sl) { var ti = show(c.id, t / sl); out.push({ id: c.id + ':' + t, start: t, end: t + sl, title: ti, desc: DESC[ti] }); }
  return out;
}
function present(c) { var e = events(c, NOW, NOW + 1)[0]; return e && e.start <= NOW && NOW < e.end ? e : null; }

var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'], MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

function radio(c) { return /radio/i.test(c.name); }

/* ================= primitive: una funzione = un evas_object ================= */

var meas = document.createElement('canvas').getContext('2d');
function textW(s, size, wt) { meas.font = size + 'px "SamsungOneUI ' + wt + '"'; return Math.round(meas.measureText(s).width); }

  var g = 4000; while (s.length > 1 && g-- > 0) { s = s.slice(0, -1); if (textW(s.replace(/\s+$/, '') + '…', size, wt) <= maxW) return s.replace(/\s+$/, '') + '…'; }
  return s;
}
function box(parent, kind, x, y, w, h, tag) {
  var e = document.createElement(tag || 'div');
  e.className = 'p'; e.dataset.k = kind;
  e.style.left = x + 'px'; e.style.top = y + 'px';
  if (w != null) e.style.width = w + 'px'; if (h != null) e.style.height = h + 'px';
  parent.appendChild(e); return e;
}
function Rect(parent, x, y, w, h, rgb, a) { var e = box(parent, 'rect', x, y, w, h); e.style.background = rgb; e.style.opacity = a; return e; }
/* immagine: slice = [top, right, bottom, left] (evas_object_image_border_set), bw = bordo disegnato (border_scale), 'tile' = image_fill ripetuto,
   tint = colore della PNG bianca (evas_object_color_set) */
function Img(parent, src, x, y, w, h, a, slice, bw, tint) {
  var e;
  if (tint && slice) {
    e = box(parent, 'img', x, y, w, h);
    var wd = (bw || slice).map(function (v) { return v + 'px'; }).join(' ');
    e.style.backgroundColor = tint; e.style.border = 'solid transparent'; e.style.borderWidth = wd;
    e.style.webkitMaskBoxImage = 'url(assets/' + src + ') ' + slice.join(' ') + ' fill / ' + wd + ' stretch';
  } else if (tint) {
    e = box(parent, 'img', x, y, w, h);
    e.style.backgroundColor = tint; e.style.webkitMaskImage = e.style.maskImage = 'url(assets/' + src + ')';
    e.style.webkitMaskSize = e.style.maskSize = '100% 100%';
  } else if (slice) {
    e = box(parent, 'img', x, y, w, h);
    if (slice === 'tile') e.style.backgroundImage = 'url(assets/' + src + ')';
    else { e.style.borderStyle = 'solid'; e.style.borderWidth = (bw || slice).map(function (v) { return v + 'px'; }).join(' '); e.style.borderImage = 'url(assets/' + src + ') ' + slice.join(' ') + ' fill stretch'; }
  } else { e = box(parent, 'img', x, y, w, h, 'img'); e.src = 'assets/' + src; e.alt = ''; }
  e.style.opacity = a == null ? 1 : a; return e;
}
function Text(parent, x, y, size, wt, a, s, maxW, right) {
  s = fit(s || '', size, wt, maxW);
  var w = textW(s, size, wt);
  var e = box(parent, 'text', right ? x - w : x, y);
  e.className = 'p t'; e.textContent = s; e.style.fontFamily = '"SamsungOneUI ' + wt + '"'; e.style.fontSize = size + 'px'; e.style.opacity = a;
  e._w = w; e._size = size; e._wt = wt; return e;
}
/* linea di base di un testo (line-height = dimensione): per allineare numeri grandi e righe piccole sulla stessa base */
function baseOff(size, wt) { meas.font = size + 'px "SamsungOneUI ' + wt + '"'; var m = meas.measureText('0'); return (size - m.fontBoundingBoxAscent - m.fontBoundingBoxDescent) / 2 + m.fontBoundingBoxAscent; }
function alignBase(el, ref) { if (!el || !ref) return; el.style.top = Math.round(parseFloat(ref.style.top) + baseOff(ref._size, ref._wt) - baseOff(el._size, el._wt)) + 'px'; }

function Logo(parent, c, x, y, size) {
  if (!c.logo) return null;
  var e = box(parent, 'img', x, y, size, size, 'img'); e.src = c.logo; e.alt = '';
  e.onerror = function () { e.style.display = 'none'; e.dataset.gone = '1'; };
  return e;
}
function Layer(id, win) { var e = document.createElement('div'); e.className = 'layer'; e.id = id; e.dataset.k = 'rect'; e.dataset.clip = '1'; e.dataset.win = win; stage.appendChild(e); return e; }
function Clip(parent, x, y, w, h) { var e = box(parent, 'rect', x, y, w, h); e.className = 'clip'; e.dataset.clip = '1'; return e; }
function Para(parent, x, y, size, wt, a, s, maxW, lines, lineH) {
  var words = s.split(/\s+/).filter(Boolean), out = [], w = 0;

    else if (mode === 'map' && b.size >= a.size) tw(x, { dx: a.x - b.x, dy: a.y - b.y, s: a.size / b.size, a: a.a }, { dx: 0, dy: 0, s: 1, a: b.a }, D.morph);
    else if (mode === 'map') { x.style.visibility = 'hidden'; after(tw(flyGhost(inn, o, a, b, false), { a: b.a }, { a: b.a }, D.morph), function () { x.style.visibility = ''; }); }
    else if (mode === 'mapx') {
      if (b.size < a.size) { flyGhost(inn, o, a, b, true); tw(x, { a: 0 }, { a: b.a }, 80, D.morph - 80, LIN); }
      else { tw(x, { dx: a.x - b.x, dy: a.y - b.y, s: a.size / b.size, a: 0 }, { dx: 0, dy: 0, s: 1, a: b.a }, D.morph); }
    }
  });
  [].forEach.call(inn.children, function (x) {
    if (flown.has(x) || x.dataset.ghost) return;
    var i = +(x.dataset.st || 0);
    if (x.dataset.clip) { var kids = x.querySelectorAll('[data-key]'); if (kids.length && [].some.call(kids, function (kk) { return flown.has(kk); })) { [].forEach.call(x.children, function (c) { if (!flown.has(c)) tw(c, { a: 0 }, { a: op(c) }, D.enter, 60 + D.stagger, LIN); }); return; } tw(x, { a: 0 }, { a: 1 }, D.enter, 60 + D.stagger, LIN); return; }
    tw(x, { dy: 20, a: 0 }, { dy: 0, a: op(x) }, D.enter, 60 + i * D.stagger);
  });
  notePeak(from + '>' + to);
  if (to === 'epg' && !SHOT) readMissing();
  countNow();
}
/* le pagine del launcher (Dock, Task manager, 123): una finestra sua; entrano con l'alpha del velo e una salita di 20 px a gruppi */
function enterLaunch(to, from, opts) {
  var L = LAUNCH[to];
  if (to === 'dock' || to === 'sources') { od.page = to; if (to === 'sources') od.src = 0; renderDock(0); } else if (to === 'tasks') { ot.row = 0; ot.sort = 0; renderTasks(0); } else { p123.page = 'digits'; p123.f = 0; p123.done = false; renderPad123(0); }
  var out = LAUNCH[from];
  S.mode = to; syncTabs(); arm();
  L.classList.add('on');
  if (opts && opts.instant) { if (out && out !== L) out.classList.remove('on'); countNow(); return; }
  if (out && out !== L) { out.style.opacity = 0; var o = tw(out, { a: 1 }, { a: 0 }, D.exit, 0, IN); after(o, function () { if (S.mode !== from) out.classList.remove('on'); out.style.opacity = ''; }); }
  if (out === L) renderDock(300);                                    // Dock <-> Sources nella stessa finestra
  else { L.style.opacity = 1; tw(L, { a: 0 }, { a: 1 }, to === 'pad123' ? 120 : 300, 0, LIN); }   // il vecchio OSD entra in alpha (Design.EnterSeconds, pad 0,12 s)
  notePeak((from || 'none') + '>' + to); countNow();
}
function leaveLaunch(from, opts) {
  var L = LAUNCH[from]; if (!L) return;
  if (opts && opts.instant) { L.classList.remove('on'); return; }
  L.style.opacity = 0; var o = tw(L, { a: 1 }, { a: 0 }, D.exit, 0, IN); after(o, function () { if (S.mode !== from) L.classList.remove('on'); L.style.opacity = ''; });
}
function go(to, opts) {
  opts = opts || {};
  var from = S.mode;
  if (to === 'toast') { if (!isTuner(from)) goTuner('banner', opts); showToast(!opts.instant); return; }
  if (isLaunch(from) && !isLaunch(to)) { leaveLaunch(from, opts); S.mode = 'none'; }
  if (to === 'volume') { if (isTuner(S.mode)) goTuner('none', opts); S.mode = 'volume'; syncTabs(); if (!VOL.on) volKey(0); return; }
  if (isLaunch(to)) {
    if (isTuner(S.mode)) { goTuner('none', opts); }            // Home: il tuner si fa da parte (SystemKeys -> Deactivate), Banner compreso
    if (toastOn) hideToast();
    enterLaunch(to, isLaunch(from) ? from : null, opts); return;
  }
  if (from === 'volume') S.mode = 'none';
  goTuner(to, opts);
}
function zap(d) {
  S.ch = (S.ch + d + CH.length) % CH.length; updateCh();
  if (S.mode === 'epg' || isLaunch(S.mode)) return;
  if (S.mode !== 'banner' && S.mode !== 'info') { go('banner'); return; }
  finishAll();
  var L = TUNER[S.mode], oldNum = L.querySelector('[data-key="num"]'), ghost = oldNum ? oldNum.cloneNode(true) : null;
  if (S.mode === 'banner') renderBanner(); else renderInfo(true);
  var nn = L.querySelector('[data-key="num"]'), dy = d > 0 ? -1 : 1;
  if (ghost) { delete ghost.dataset.key; ghost.dataset.ghost = 1; L.appendChild(ghost); ghost.style.opacity = 0; after(tw(ghost, { dy: 0, a: 1 }, { dy: dy * 60, a: 0 }, D.exit, 0, IN), function () { ghost.remove(); }); }
  tw(nn, { dy: -dy * 60, a: 0 }, { dy: 0, a: 1 }, D.zap, 60);
  [].forEach.call(L.children, function (x) { if (x !== nn && !x.dataset.ghost) tw(x, { a: 0 }, { a: op(x) }, D.zap, 80, LIN); });
  notePeak('zap ' + S.mode);
  arm(); countNow();
}
var timer = null;
function arm() { clearTimeout(timer); if (!S.timers || S.mode === 'none') return; var t = { banner: 4000, info: 10000, epg: 60000, chpad: 20000, list: 8000, pad123: 14000 }[S.mode]; if (t) timer = setTimeout(function () { go('none'); }, t); }

/* ================= contatore degli oggetti per finestra (tasto O) ================= */
function countLayer(L, extra) {
  var n = { rect: 1, img: extra ? 1 : 0, text: 0 };   // il clip del livello (rect) e, per il tuner, il velo condiviso
  L.querySelectorAll('[data-k]').forEach(function (x) { if (x.dataset.gone || x.dataset.ghost || x.dataset.leaving || x.style.display === 'none') return; n[x.dataset.k]++; });
  n.total = n.rect + n.img + n.text;
  return n;
}
function countNow() {
  var wins = [];
  if (TUNER[S.mode]) wins.push(['tuner · ' + S.mode, countLayer(TUNER[S.mode], true)]);
  if (toastOn) wins.push(['tuner · toast', countLayer(LTo)]);
  if (LAUNCH[S.mode]) wins.push(['launcher · ' + S.mode, countLayer(LAUNCH[S.mode])]);
  if (VOL.on) wins.push(['volume', countLayer(LV)]);
  var out = {}; wins.forEach(function (w) { out[w[0]] = w[1]; });
  document.getElementById('counts').textContent = JSON.stringify({ mode: S.mode, wins: out, peak: peak });
  document.getElementById('counter').textContent = !wins.length ? 'nothing on screen' : wins.map(function (w) { var c = w[1]; return w[0].toUpperCase() + '\n  rect ' + c.rect + '  img ' + c.img + '  text ' + c.text + '  = ' + c.total; }).join('\n') +
    '\n\nanimated together, last: ' + (peak.last || '-');
}

/* ================= barra del mock ================= */
var BGS = [['night', 'Night'], ['snow', 'Bright (snow)'], ['pitch', 'Pitch'], ['concert', 'Concert'], ['black', 'Black (radio)']];
var bgWrap = document.getElementById('bgs');
BGS.forEach(function (b) { var x = document.createElement('button'); x.textContent = b[1]; x.dataset.bg = b[0]; x.onclick = function () { setBg(b[0]); x.blur(); }; bgWrap.appendChild(x); });
function setBg(b) { S.bg = b; stage.setAttribute('data-bg', b); bgWrap.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x.dataset.bg === b); }); }
function syncTabs() { document.querySelectorAll('#tabs button').forEach(function (x) { x.setAttribute('aria-pressed', x.dataset.go === S.mode || (x.dataset.go === 'toast' && toastOn)); }); }
function updateCh() { document.getElementById('chname').textContent = CH[S.ch].num + '  ' + CH[S.ch].name; }
document.querySelectorAll('#tabs button').forEach(function (x) { x.onclick = function () { go(x.dataset.go); x.blur(); }; });
document.getElementById('chup').onclick = function () { S.mode === 'epg' ? epgMove(function () { g.movePage(1); }) : zap(1); };
document.getElementById('chdn').onclick = function () { S.mode === 'epg' ? epgMove(function () { g.movePage(-1); }) : zap(-1); };
document.getElementById('vup').onclick = function () { volKey(5); };
document.getElementById('vdn').onclick = function () { volKey(-5); };
document.getElementById('vmute').onclick = function () { volKey(0, true); };
function redraw() { var m = S.mode; if (m === 'none' || m === 'volume') return; Object.keys(TUNER).forEach(function (k) { TUNER[k].classList.remove('on'); }); Object.keys(LAUNCH).forEach(function (k) { LAUNCH[k].classList.remove('on'); }); S.mode = 'none'; go(m, { instant: true }); if (toastOn) showToast(false); }
document.getElementById('state').onchange = function (ev) { S.state = ev.target.value; ev.target.blur(); redraw(); };
document.getElementById('today').checked = OSD_TODAY;
document.getElementById('today').onchange = function (ev) { var q = new URLSearchParams(location.search); if (ev.target.checked) q.set('osd', 'today'); else q.delete('osd'); location.search = q.toString(); };
document.getElementById('timers').onchange = function (ev) { S.timers = ev.target.checked; arm(); };
var cnt = document.getElementById('cnt');
function setCount(on) { cnt.checked = on; document.body.classList.toggle('count', on); countNow(); }
cnt.onchange = function () { setCount(cnt.checked); cnt.blur(); };

var SCREENS = { '1': 'banner', '2': 'info', '3': 'epg', '4': 'dock', '5': 'tasks', '6': 'volume', '7': 'pad123', '8': 'chpad', '9': 'list', '0': 'toast' };
addEventListener('keydown', function (e) {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.tagName === 'SELECT') return;
  var k = e.key, m = S.mode;
  if ((m === 'chpad' || m === 'pad123') && /^\d$/.test(k)) { if (m === 'chpad') padKey(k); else pad123Key(k); e.preventDefault(); return; }
  if (SCREENS[k]) go(SCREENS[k]);
  else if (k === 'o' || k === 'O') setCount(!cnt.checked);
  else if (k === 'b' || k === 'B') { var i = BGS.findIndex(function (b) { return b[0] === S.bg; }); setBg(BGS[(i + 1) % BGS.length][0]); }
  else if (k === '+' || k === '=') volKey(5); else if (k === '-' || k === '_') volKey(-5); else if (k === 'm' || k === 'M') volKey(0, true);
  else if (k === 'PageUp' || k === 'PageDown') { var d = k === 'PageUp' ? 1 : -1; if (m === 'epg') epgMove(function () { g.movePage(d); }); else zap(d); }
  else if (m === 'epg') {
    if (k === 'ArrowUp') epgMove(function () { g.moveRow(-1); }); else if (k === 'ArrowDown') epgMove(function () { g.moveRow(1); });
    else if (k === 'ArrowLeft') epgMove(function () { g.moveTime(-1); }); else if (k === 'ArrowRight') epgMove(function () { g.moveTime(1); });
    else if (k === 'Enter') { S.ch = g.focusRow; updateCh(); go('banner'); }
    else if (k === 'Escape' || k === 'Backspace') go('none');
    else return;
  } else if (m === 'chpad') { if (k === 'Escape') go('none'); else if (!padKey(k)) return; }
  else if (m === 'list') { if (k === 'Escape' || k === 'Backspace') go('none'); else if (!listKey(k)) return; }
  else if (m === 'dock' || m === 'sources') { if (!dockKey(k)) return; }
  else if (m === 'tasks') { if (!tasksKey(k)) return; }
  else if (m === 'pad123') { if (k === 'Escape') go('none'); else if (!pad123Key(k)) return; }
  else {
    if (k === 'ArrowUp') zap(1); else if (k === 'ArrowDown') zap(-1);
    else if (k === 'ArrowRight' && (m === 'banner' || m === 'none' || m === 'info')) go('chpad');
    else if (k === 'Enter' && (m === 'banner' || m === 'none')) go('list');
    else if (k === 'Escape' || k === 'Backspace') { if (toastOn) hideToast(); go('none'); }
    else return;
  }
  e.preventDefault();
});
function fit2() {
  if (document.body.classList.contains('shot')) { stage.style.transform = 'none'; stage.style.left = stage.style.top = '0px'; return; }
  var w = document.getElementById('wrap'), W = w.clientWidth, H = w.clientHeight;
  var sc = Math.min(W / 1920, H / 1080);
  stage.style.transform = 'scale(' + sc + ')';
  stage.style.left = Math.round((W - 1920 * sc) / 2) + 'px'; stage.style.top = Math.round((H - 1080 * sc) / 2) + 'px';
}
addEventListener('resize', fit2);

/* ================= avvio =================
   ?shot=banner|info|epg|dock|tasks|volume|pad123|chpad|list|toast &bg= &ch= &state= &vol=NN &mute=1 &press=ArrowRight,Enter
   ?freeze=banner>info@160 (un passaggio fermato a 160 ms), ?freeze=banner>vol@120 (il volume che compare sopra al Banner), ?count, ?selftest */
S.ch = clamp(parseInt(Q.get('ch') || '2', 10) - 1, 0, CH.length - 1);
S.state = Q.get('state') || 'ok'; document.getElementById('state').value = S.state;
if (Q.has('vol')) VOL.level = +Q.get('vol'); if (Q.get('mute') === '1') VOL.muted = true;
setBg(Q.get('bg') || 'night'); updateCh();
if (SHOT) document.body.classList.add('shot', 'still');
fit2();
var moves = (Q.get('moves') || '').split(',').filter(Boolean);
function applyMoves() { moves.forEach(function (mv) { var f = { u: function () { g.moveRow(-1); }, d: function () { g.moveRow(1); }, l: function () { g.moveTime(-1); }, r: function () { g.moveTime(1); } }[mv]; if (f) f(); }); if (moves.length) { drawGrid(null); drawFocus(null); drawHeader(false); } }
function press(list) { list.split(',').forEach(function (k) { dispatchEvent(new KeyboardEvent('keydown', { key: k })); finishAll(); }); }
document.fonts.load('28px "SamsungOneUI 200"').then(function () { return document.fonts.load('28px "SamsungOneUI 500"'); }).then(function () { return document.fonts.load('28px "SamsungOneUI 600"'); }).then(function () {
  if (Q.has('count')) setCount(true);
  if (Q.has('freeze')) {
    var m = /^(\w+)>(\w+)@(\d+)$/.exec(Q.get('freeze'));
    if (m[1] !== 'none') go(m[1], { instant: true });
    if (m[1] === 'epg') { applyMoves(); finishAll(); }
    if (Q.get('press')) press(Q.get('press'));
    if (Q.get('withvol')) { VOL.level = +Q.get('withvol'); volKey(0); finishAll(); }
    setTimeout(function () {
      var KEYS = { right: 'ArrowRight', left: 'ArrowLeft', down: 'ArrowDown', up: 'ArrowUp', ok: 'Enter' };
      if (m[2] === 'vol') volKey(5);
      else if (KEYS[m[2]]) dispatchEvent(new KeyboardEvent('keydown', { key: KEYS[m[2]] })); else go(m[2]);
      FROZEN = true;
      document.getAnimations().forEach(function (a) { if (a.effect && a.effect.target && stage.contains(a.effect.target)) { a.pause(); try { a.currentTime = +m[3]; } catch (x) {} } });
      countNow(); document.body.setAttribute('data-ready', '1');
    }, 50);
  } else if (Q.has('shot')) {
    var sh = Q.get('shot').split('+');
    go(sh[0], { instant: true }); applyMoves();
    if (Q.get('press')) press(Q.get('press'));
    if (sh[1] === 'vol' || sh[0] === 'volume') { if (sh[0] !== 'volume') volKey(0); finishAll(); }
    if (sh[1] === 'toast') showToast(false);
    finishAll(); countNow();
    if (Q.has('check')) setTimeout(function () { document.getElementById('selftest').textContent = JSON.stringify(alignCheck()); }, 60);
    if (Q.has('boxes')) setTimeout(function () {
      var bx = []; stage.querySelectorAll('.layer.on .t').forEach(function (t) { var r = t.getBoundingClientRect(); bx.push([Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height), op(t), t._size, t.textContent.slice(0, 24)]); t.style.visibility = 'hidden'; });
      document.getElementById('selftest').textContent = JSON.stringify(bx);
    }, 60);
    document.body.setAttribute('data-ready', '1');
  } else if (Q.has('selftest')) selftest();
  else setTimeout(function () { go('banner'); }, 300);
});

function selftest() {
  var steps = [], modes = ['banner', 'info', 'epg', 'chpad', 'list', 'dock', 'sources', 'tasks', 'pad123', 'volume', 'none'];
  ['ok', 'unread', 'none', 'long', 'track2', 'nodata'].forEach(function (s) {
    steps.push(function () { S.state = s; });
    modes.forEach(function (a) { modes.forEach(function (b) { steps.push(function () { go(a, { instant: true }); }); steps.push(function () { go(b); }); }); });
  });
  steps.push(function () { S.state = 'ok'; });
  BGS.forEach(function (b) { steps.push(function () { setBg(b[0]); go('info'); }); });
  var seq = ['3', 'ArrowDown', 'ArrowRight', 'ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', 'Enter', '2', '1', 'ArrowRight', '1', '2', 'ArrowDown', 'Enter', '9', 'ArrowDown', 'ArrowDown', 'Enter',
    '4', 'ArrowRight', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'ArrowRight', 'ArrowRight', 'ArrowRight', 'ArrowRight', 'ArrowRight', 'ArrowRight', 'ArrowRight', 'ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowLeft', 'ArrowDown',
    'ArrowDown', 'ArrowDown', 'ArrowRight', 'x', 'ArrowUp', 'ArrowUp', 'ArrowUp', '7', '4', '2', 'ArrowRight', 'Enter', 'Backspace', 'ArrowRight', 'ArrowRight', 'ArrowRight', 'ArrowRight', 'ArrowRight', 'ArrowRight', 'ArrowRight', 'ArrowRight', 'ArrowRight', 'ArrowRight', 'ArrowRight', 'ArrowRight', 'Enter', 'ArrowRight', 'ArrowRight', 'ArrowLeft', 'ArrowLeft', 'ArrowLeft', 'Enter', 'ArrowUp', 'Enter',
    '+', '+', '-', 'm', 'm', '0', '6', 'Escape'];
  seq.forEach(function (k) { steps.push(function () { dispatchEvent(new KeyboardEvent('keydown', { key: k })); }); });
  for (var i = 0; i < 40; i++) steps.push(function () { if (S.mode !== 'epg') go('epg'); var r = Math.random(); epgMove(function () { if (r < .2) g.moveRow(1); else if (r < .4) g.moveRow(-1); else if (r < .7) g.moveTime(1); else if (r < .95) g.moveTime(-1); else g.movePage(1); }); });
  var i2 = 0;
  (function next() {
    if (i2 >= steps.length) { document.getElementById('selftest').textContent = 'SELFTEST steps=' + steps.length + ' errors=' + errors.length + ' ' + errors.join(' | ') + ' PEAK ' + JSON.stringify(peak); document.body.setAttribute('data-ready', '1'); return; }
    try { steps[i2++](); } catch (e) { errors.push(String(e && e.stack || e)); }
    setTimeout(next, 25);
  }());
}
}());
