<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Vetro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="$WEBAPIS/webapis/webapis.js"></script>
<style>
/* Values from design-system/tokens.css (dark), status colours from the dashboard. Static page: solid surfaces,
   no blur, no animation. Flex without gap and ES5 only, so older TV runtimes draw it the same. */
:root{--bg:#0d141f;--surface:#243448;--raised:#505d6d;--text:#f5f8ff;--muted:#bdc2c8;--border:#546170;--link:#f5f8ff;--ring:#e4f2ff;--light:#a5d8ff;
--ok:rgb(127,203,160);--warn:rgb(226,184,103);--bad:rgb(239,138,128);
--ok-soft:rgba(127,203,160,.12);--warn-soft:rgba(226,184,103,.12);--bad-soft:rgba(239,138,128,.12);
--ok-line:rgba(127,203,160,.4);--warn-line:rgba(226,184,103,.4);--bad-line:rgba(239,138,128,.4)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"SamsungOneUI","Samsung One UI Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.safe{position:absolute;top:96px;left:96px;right:96px;bottom:96px}   /* the TV safe margin: 96 px on every side */
.hero{display:flex;align-items:center}
.hero img{width:176px;height:176px;border-radius:16px;display:block;flex:none;margin-right:48px}
.hero h1{margin:0;font-size:84px;line-height:1.05;font-weight:500;letter-spacing:-.04em}
.meta{margin-top:12px;font-size:28px;color:var(--muted)}
.state{margin-top:20px;display:inline-flex;align-items:center;font-size:28px;font-weight:500;padding:8px 20px 8px 12px;border-radius:12px;border:2px solid var(--ok-line);background:var(--ok-soft);color:var(--ok)}
.state svg{width:32px;height:32px;margin-right:12px;flex:none}
.state.warn{border-color:var(--warn-line);background:var(--warn-soft);color:var(--warn)}
.state.bad{border-color:var(--bad-line);background:var(--bad-soft);color:var(--bad)}
.state.wait{border-color:var(--border);background:transparent;color:var(--muted)}
/* The one moving thing: a slowly turning dashed ring while the checks run or a switch is working, so a quiet screen does not look stuck. */
@keyframes spin{to{transform:rotate(360deg)}}
.state.wait svg,.c.wait .ic{animation:spin 2.4s linear infinite}
.dash{margin-left:auto;align-self:stretch;display:flex;flex-direction:column;justify-content:center;width:760px;padding:28px 36px;border-radius:16px;background:var(--surface);border:2px solid var(--border)}
.dh{display:flex;align-items:baseline}
.dh small{font-size:22px;letter-spacing:.12em;color:var(--muted)}
/* The sign-in code: hidden, and the card does not move, until a browser asks to pair. */
.pin{margin-left:auto;font-size:22px;letter-spacing:.12em;color:var(--muted)}
.pin i{display:block;margin-top:4px;font-size:20px;font-style:normal;letter-spacing:0;text-align:right;color:var(--muted)}
.pin b{margin-left:12px;font-family:monospace;font-size:30px;letter-spacing:.2em;color:var(--text)}
.url{margin:10px 0 8px;font-family:monospace;font-size:44px;font-weight:500;color:var(--link);white-space:nowrap}
.url.off{color:var(--muted)}
.dash p{margin:0;font-size:24px;line-height:1.35;color:var(--muted)}
.panel{position:absolute;left:0;right:0;bottom:0;padding:32px 36px 28px;border-radius:16px;background:var(--surface);border:2px solid var(--border)}
.panel.bad{border-color:var(--bad-line)}.panel.warn{border-color:var(--warn-line)}
.ph{display:flex;align-items:center;margin-bottom:24px}
.ph h2{margin:0;font-size:36px;font-weight:500;letter-spacing:-.02em}
.sum{margin-left:auto;font-size:26px;font-weight:500;color:var(--ok)}
.sum.warn{color:var(--warn)}.sum.bad{color:var(--bad)}.sum.wait{color:var(--muted)}
.grid{display:flex;flex-wrap:wrap}
.c{display:flex;width:calc(33.333% - 11px);margin:0 16px 16px 0;padding:20px 22px;border-radius:12px;background:var(--raised);border:2px solid transparent;min-height:112px}
.c:nth-child(3n){margin-right:0}
.c.warn{background:var(--warn-soft);border-color:var(--warn-line)}
.c.bad{background:var(--bad-soft);border-color:var(--bad-line)}
.c.na{opacity:.6}
.c.wait{background:transparent;border-color:var(--border)}.c.wait .v{color:var(--muted);font-weight:400}
.ic{flex:none;width:40px;height:40px;margin-right:18px}
.n{font-size:26px;line-height:1.2;color:var(--muted)}
.v{margin-top:2px;font-size:30px;line-height:1.2;font-weight:500}
.v span{font-weight:400;color:var(--muted);font-size:24px}
.c.warn .v{color:var(--warn)}.c.bad .v{color:var(--bad)}
.h{margin-top:8px;font-size:23px;line-height:1.35}
.share{display:flex;align-items:center;margin-top:4px;padding-top:20px;border-top:2px solid var(--border)}
.share .t{font-size:22px;color:var(--muted);flex:none;width:250px;margin-right:24px;line-height:1.3}
.share code{font-family:monospace;font-size:22px;word-break:break-word;line-height:1.4}
.share em{font-style:normal;color:var(--bad);font-weight:700}.share em.w{color:var(--warn)}
.keys{display:flex;justify-content:flex-end;margin-top:18px;font-size:22px;color:var(--muted)}
.keys span{margin-left:28px}
.keys i{font-style:normal;display:inline-block;margin-right:10px;padding:2px 12px;border:2px solid var(--border);border-radius:12px;color:var(--text)}

/* Quick controls (the main view): five tiles that do what one switch of the dashboard does, and a strip with the checks.
   Same system as the rest of the page: system sans at 400 and 500 only, 16 px surfaces, 8 px controls, solid fills, a uniform border
   everywhere (focus is a brighter border plus an outline, never a coloured edge). Scale for a TV at 1920 px: section title 40, card
   title 32, text 25, labels 22 in capitals, values 26. One inset (28) for every card, so every text edge lines up. */
/* The main view follows the Fumé mock-up (design-system/tv-system.html): the header is one sheet, the title strip is a sheet, the tiles are 452 high, the checks strip is 104 high: 872 px in the 888 px between the margins. */
#screen.compact .hero{height:192px;padding:0 28px;background:var(--surface);border:2px solid var(--border);border-radius:16px}
#screen.compact .hero img,#screen.compact .hero .logo{width:128px;height:128px;border-radius:16px;margin-right:32px}
#screen.compact .hero h1{font-size:56px}
#screen.compact .meta{margin-top:6px;font-size:26px}
#screen.compact .state{margin-top:12px;font-size:26px;padding:4px 20px 4px 10px}
#screen.compact .dash{width:640px;height:144px;align-self:center;padding:14px 24px;border-radius:12px;background:var(--raised);border:0}
#screen.compact .url{margin:4px 0 4px;font-size:36px}
#screen.compact .dash p{font-size:24px;line-height:1.3}
.sec{display:flex;align-items:baseline;margin:44px 0 22px}
#screen.compact .sec{align-items:center;height:64px;margin:16px 0 20px;padding:0 32px;background:var(--surface);border:2px solid var(--border);border-radius:16px}
.sec h2{margin:0;font-size:32px;line-height:1.1;font-weight:500;letter-spacing:-.02em}
.sec span{margin-left:auto;font-size:24px;color:var(--muted)}
.tiles{display:flex}
.tile{position:relative;flex:1;height:480px;margin-right:20px;padding:28px;border-radius:16px;background:var(--surface);border:2px solid var(--border);display:flex;flex-direction:column}
.tile:last-child{margin-right:0}
.tile.focus{background:var(--raised);border-color:var(--ring);outline:2px solid var(--ring);outline-offset:2px}
.tile.na{opacity:.55}
.tile .top{display:flex;align-items:center;margin-bottom:22px}
.tile .glyph{width:64px;height:64px;border-radius:12px;background:var(--raised);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex:none}
.tile.focus .glyph{background:#6a7583}
#screen.compact .tile{height:452px}
.tile .glyph svg{width:36px;height:36px}
.tile .tag{margin-left:auto;font-size:22px;letter-spacing:.12em;color:var(--muted)}
/* Two lines are always reserved for the title, so the text under it starts at the same height in every tile. */
.tile h3{margin:0;min-height:2.3em;font-size:32px;line-height:1.15;font-weight:500;letter-spacing:-.01em}
.tile p{margin:12px 0 0;font-size:25px;line-height:1.4;font-weight:400;color:var(--muted)}
.tile .foot{margin-top:auto;display:flex;align-items:center;min-height:56px}
.tile .val{font-size:26px;font-weight:500;margin-left:18px}
.val.ok{color:var(--ok)}.val.warn{color:var(--warn)}.val.bad{color:var(--bad)}.val.mute{color:var(--muted)}
.sw{flex:none;width:88px;height:48px;border-radius:999px;border:2px solid var(--border);background:transparent;position:relative}
.sw i{position:absolute;top:5px;left:5px;width:34px;height:34px;border-radius:50%;background:var(--muted)}
.sw.on{background:var(--light);border-color:var(--light)}
.sw.on i{left:45px;background:var(--surface)}
.sw.part{background:var(--warn-soft);border-color:var(--warn-line)}
.sw.part i{left:25px;background:var(--warn)}
.sw.busy i{left:25px;background:transparent;border:3px dashed var(--muted);animation:spin 2.4s linear infinite}
.btn{flex:none;display:flex;align-items:center;height:56px;padding:0 28px;font-size:26px;font-weight:500;border-radius:12px;border:2px solid var(--border);color:var(--text);background:var(--raised)}
.btn.go{border-color:var(--ok-line);background:var(--ok-soft);color:var(--ok)}
.tile.focus .btn{background:var(--surface)}
.tile.focus .btn.go{background:var(--ok-soft)}
/* The strip: the label, the chips and the hint sit on the first row; when the chips wrap, the next row hangs under them. */
.diag{position:relative;margin-top:24px;min-height:104px;border-radius:16px;background:var(--surface);border:2px solid var(--border);padding:20px 28px;display:flex;align-items:flex-start}
.diag.warn{border-color:var(--warn-line)}.diag.bad{border-color:var(--bad-line);background:var(--bad-soft)}
.diag.focus{border-color:var(--ring);outline:2px solid var(--ring);outline-offset:2px;background:var(--raised)}
.diag h4{margin:0 28px 0 0;font-size:26px;line-height:34px;font-weight:500;flex:none}
.chips{display:flex;flex:1;flex-wrap:wrap}
.chip{display:flex;align-items:center;margin-right:26px;font-size:22px;line-height:34px;font-weight:400;color:var(--muted);white-space:nowrap}
.chip b{font-weight:500;color:var(--text);margin-left:8px}
.chip.warn b{color:var(--warn)}.chip.bad b{color:var(--bad)}
.dot{width:16px;height:16px;border-radius:50%;margin-right:10px;flex:none;background:var(--ok)}
.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.na,.dot.off{background:transparent;border:2px dashed var(--muted)}
.more{margin-left:16px;flex:none;font-size:22px;line-height:34px;color:var(--muted);white-space:nowrap}
/* The message sits in the free space above the strip, near what was pressed, and does not cover the title. */
.toast{position:absolute;left:50%;bottom:150px;max-width:1500px;transform:translateX(-50%);padding:10px 28px;border-radius:16px;background:var(--raised);border:2px solid var(--border);font-size:24px;line-height:1.3;text-align:center}
</style></head>
<body>
<div id="stage"><div class="safe" id="screen"></div></div>
<script>
var BASE = 'http://127.0.0.1:8099';
var ICON = 'icon.png';
var IDLE_MS = 300000;
var report = {probe: {}, apps: [], packages: [], settings: {}};
var delivered = false, running = false, idleTimer = null;
// The whole check stops after TOTAL_MS even if a step is stuck (every step also has its own limit).
var TOTAL_MS = 100000;
var step = null, tick = null, posts = Promise.resolve(), lastScreen = null, packagesBusy = false, packagesAgain = false;
// Dashboard sign-in: the service asks for a 6-digit code that only this screen shows (see service/auth.js).
var pairing = null;
// The service keeps running without this page; a resident page only holds memory.
function leave() { try { tizen.application.getCurrentApplication().exit(); } catch (e) {} }
// Every probe gets a time limit: a Tizen call whose callback never fires must not leave the screen on "Checking".
function attempt(name, fn, limit) {
  return new Promise(function (resolve) {
    var done = false, timer = setTimeout(function () { finish({ok: false, error: 'no answer in ' + Math.round(limit / 1000) + ' s'}); }, limit || 8000);
    function finish(r) { if (done) return; done = true; clearTimeout(timer); report.probe[name] = r; resolve(); }
    try {
      Promise.resolve(fn()).then(function (v) { finish({ok: true, value: v}); },
        function (e) { finish({ok: false, error: String(e && e.message || e)}); });
    } catch (e) { finish({ok: false, error: String(e && e.message || e)}); }
  });
}
// A public-level certificate may not get the on-boot start honored, so the page starts the service itself.
function launchService() {
  return cb(function (ok, ko) {
    function failed(e) { ko(new Error('launch failed (wrt:service: ' + (e && e.message || e) + ')')); }
    if (typeof window.a2sService === 'function') {
      try { Promise.resolve(new window.a2sService('vetrotvapp.svc').start()).then(ok, failed); }
      catch (e) { failed(e); }
      return;
    }
    tizen.application.launch('vetrotvapp.svc', ok, ko);
  });
}
// Some TVs (The Frame 2025, Tizen 9) do not let apps reach a local service over loopback: 127.0.0.1 never answers (#122).
// The service listens on every interface, so if loopback stays silent the TV's own LAN address is tried, and the first
// one that answers becomes the base for everything else. Where loopback works nothing changes. The service accepts the
// TV's own address like loopback, and nothing else. Idea and measurements: skjnldsv (#122, #123). Whether the runtime lets
// the page call an address that config.xml does not list is not known yet.
function answers(base) {
  return new Promise(function (ok) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', base + '/status', true);
    xhr.timeout = 3000;
    // A refusal that can be read is kept (and shown on the screen) even while another address is still being tried.
    xhr.onload = function () {
      if (xhr.status !== 200) {
        var d = null;
        try { d = JSON.parse(xhr.responseText); } catch (e) {}
        if (d && d.seen) refusal = refusedText(xhr.status, d);
      }
      ok(xhr.status === 200);
    };
    xhr.onerror = xhr.ontimeout = function () { ok(false); };
    try { xhr.send(); } catch (e) { ok(false); }
  });
}
function lanAddresses() {
  if (typeof tizen === 'undefined' || !tizen.systeminfo) return Promise.resolve([]);
  return Promise.all(['ETHERNET_NETWORK', 'WIFI_NETWORK'].map(function (prop) {
    return new Promise(function (ok) {
      var t = setTimeout(function () { ok(null); }, 3000);
      try {
        tizen.systeminfo.getPropertyValue(prop, function (v) { clearTimeout(t); ok(v && v.ipAddress || null); },
          function () { clearTimeout(t); ok(null); });
      } catch (e) { clearTimeout(t); ok(null); }
    });
  })).then(function (ips) { return ips.filter(function (ip) { return ip && ip !== '0.0.0.0' && /^\d{1,3}(\.\d{1,3}){3}$/.test(ip); }); });
}
var baseChosen = null, lanKnown = null;
// Resolves true when some address answered (and BASE is then that one), false when none did. A failure is not kept: the
// service may simply not be up yet, and the next try looks again.
function pickBase() {
  if (baseChosen) return Promise.resolve(true);
  var port = BASE.split(':').pop();
  return answers(BASE).then(function (yes) {
    if (yes) { baseChosen = BASE; return true; }
    return (lanKnown || (lanKnown = lanAddresses())).then(function (ips) {
      return ips.reduce(function (p, ip) {
        return p.then(function (found) {
          if (found) return found;
          var base = 'http://' + ip + ':' + port;
          return answers(base).then(function (y) { return y ? base : null; });
        });
      }, Promise.resolve(null));
    }).then(function (found) { if (found) { BASE = found; baseChosen = found; } return !!found; });
  });
}
function settleBase(tries) {
  return pickBase().then(function (ok) {
    if (ok || tries <= 1) return ok;
    return new Promise(function (resolve) { setTimeout(resolve, 1500); }).then(function () { return settleBase(tries - 1); });
  });
}
// The service sends a reason and what it saw (address, Origin) when it refuses this page. A refusal is final: no retry.
var refusal = null;
function refusedText(status, d) {
  var seen = (d && d.seen) || {};
  return 'HTTP ' + status + (seen.address ? ' from ' + String(seen.address).slice(0, 45) : '') + (seen.origin ? ' origin ' + String(seen.origin).slice(0, 60) : '');
}
function reach(tries) {
  return fetch(BASE + '/status').then(function (r) {
    if (r.status === 200) return r.status;
    return r.json().then(null, function () { return null; }).then(function (d) {
      refusal = refusedText(r.status, d);
      throw new Error('refused: ' + refusal);
    });
  }, function (e) {
    if (tries <= 1) throw e;
    return new Promise(function (resolve) { setTimeout(resolve, 1500); }).then(function () { return reach(tries - 1); });
  });
}
function cb(call) { return new Promise(function (ok, ko) { call(ok, ko); }); }
function sendReport(body, ms) {
  return new Promise(function (resolve, reject) {
    var xhr = new XMLHttpRequest();
    xhr.open('POST', BASE + '/probe', true);
    xhr.timeout = ms || 10000;
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onload = function () {
      var result;
      try { result = JSON.parse(xhr.responseText); } catch (e) { return reject(new Error('Response is not JSON')); }
      if (xhr.status !== 200 || result.ok !== true) return reject(new Error('Report rejected: HTTP ' + xhr.status));
      resolve({status: xhr.status, persisted: result.persisted});
    };
    xhr.onerror = function () { reject(new Error('Report send failed')); };
    xhr.ontimeout = function () { reject(new Error('Report send timeout')); };
    xhr.send(body);
  });
}
// What the TV screen shows: one small JSON read. The launcher check inside it can take a few seconds.
function readScreen() {
  return new Promise(function (resolve, reject) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', BASE + '/screen', true);
    xhr.timeout = 12000;
    xhr.onload = function () {
      var d;
      try { d = JSON.parse(xhr.responseText); } catch (e) { return reject(new Error('Response is not JSON')); }
      if (xhr.status !== 200 || !d || d.error) {
        if (xhr.status !== 200 && d && d.seen) refusal = refusedText(xhr.status, d);
        return reject(new Error('HTTP ' + xhr.status));
      }
      resolve(d);
    };
    xhr.onerror = function () { reject(new Error('Service unreachable')); };
    xhr.ontimeout = function () { reject(new Error('Service timeout')); };
    xhr.send();
  });
}
function tryConnect(port) {
  return new Promise(function (resolve, reject) {
    var ws = new WebSocket('ws://127.0.0.1:' + port + '/api/v2/channels/samsung.remote.control?name=' + btoa('Vetro'));
    var t = setTimeout(function () { try { ws.close(); } catch (e) {} reject(new Error('timeout')); }, 4000);
    ws.onopen = function () { clearTimeout(t); ws.close(); resolve('open'); };
    ws.onerror = function () { clearTimeout(t); reject(new Error('refused')); };
  });
}
// The steps run side by side, except that the service answer waits for the service start. The model and the service
// answer open the reports: a first one goes out as soon as both are in, so a screen closed early still leaves the TV
// named in the report (#101). From then on every step that ends sends what it has. The package list is the slow one (#83, #94, #104): it is read after the verdict, so it can no longer hold the screen on "Checking".
// Each entry: name, call, time limit (ms), what the screen calls the step.
var jobs = [
  ['serviceLaunch', launchService, 8000, 'Starting the service'],
  ['tizenObject', function () { return typeof tizen !== 'undefined'; }, 8000, 'Tizen API'],
  ['webapisObject', function () { return typeof webapis !== 'undefined'; }, 8000, 'Samsung API'],
  ['productinfo', function () {
      ['getModel', 'getRealModel', 'getFirmware', 'getModelCode', 'getLocalSet', 'getSmartTVServerType'].forEach(function (m) {
        var id = {getModel: 'model', getRealModel: 'realModel', getFirmware: 'firmware', getModelCode: 'modelCode',
          getLocalSet: 'localSet', getSmartTVServerType: 'smartHubServer'}[m];
        try { report.settings[id] = webapis.productinfo[m](); } catch (e) {}
      });
      // Tizen platform version ("6.5", "9.0", ...). Public API, no root needed; absent or refused on some firmware.
      try {
        var pv = tizen.systeminfo.getCapability('http://tizen.org/feature/platform.version');
        if (typeof pv === 'string' && pv) report.settings.platformVersion = pv;
      } catch (e) {}
      return Object.keys(report.settings).length; }, 8000, 'Model and firmware'],
  ['supportedKeys', function () { return tizen.tvinputdevice.getSupportedKeys().map(function (k) { return k.name; }); }, 8000, 'Remote keys'],
  ['serviceReach', function () { return settleBase(3).then(function () { return reach(8); }); }, 40000, 'Service answer'],
  ['remoteApi8001', function () { return tryConnect(8001); }, 8000, 'TV remote API'],
  ['systeminfoBattery', function () { return cb(function (ok, ko) { tizen.systeminfo.getPropertyValue('BUILD', ok, ko); }); }, 8000, 'System info'],
  ['apps', function () { return cb(function (ok, ko) { tizen.application.getAppsInfo(ok, ko); }).then(function (a) {
      report.apps = a.map(function (x) { return {id: x.id, name: x.name, packageId: x.packageId, show: x.show}; });
      return a.length; }); }, 8000, 'Installed apps']
];
var SERVICE_REACH = jobs.map(function (j) { return j[0]; }).indexOf('serviceReach');   // the one step that waits for another
var later = ['packages', function () { return cb(function (ok, ko) { tizen.package.getPackagesInfo(ok, ko); }).then(function (p) {
    report.packages = p.map(function (x) { return {id: x.id, version: x.version, totalSize: x.totalSize, author: x.author}; });
    return p.length; }); }, 30000, 'Package list'];
var LABELS = {};
jobs.concat([later]).forEach(function (j) { LABELS[j[0]] = j[3]; });

// ---- the screen -------------------------------------------------------------------------------------------
var ICONS = {

// After an update the service restarts. Once it reports the new version this screen is reloaded to get the new page too.

function renderDetails(d, waiting) {

    '<div class="grid">' + cells + '</div>' +

function fit() {
  var k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080), s = document.getElementById('stage');
  if (s && s.style) s.style.transform = 'scale(' + k + ')';
}

// ---- run ----------------------------------------------------------------------------------------------------
// Asks the service every 2 s whether a browser is waiting to pair; only loopback may read the code.
function pinLine() {
  var left = Math.max(0, Math.ceil((pairing.until - Date.now()) / 1000));
  return pairing.name + ' · ' + Math.floor(left / 60) + ':' + (left % 60 < 10 ? '0' : '') + left % 60;
}
// Set when a browser waits for a code but the service would not give it to this screen: said on screen, not left blank.
var pairingBlocked = null;
function paintPairing() {

  if (pairing && pairing.until <= Date.now()) pairing = null;   // a lost answer must not leave a dead code on screen
  if (!el) return;
  if (!pairing && pairingBlocked) {
    el.hidden = false;
    el.innerHTML = 'PIN<b>&mdash;</b><i>' + esc(pairingBlocked) + '</i>';
    return;
  }
  el.hidden = !pairing;
  el.innerHTML = 'PIN<b>' + (pairing ? esc(pairing.code.slice(0, 3) + ' ' + pairing.code.slice(3)) : '') + '</b><i>' + esc(pairing ? pinLine() : '') + '</i>';

// A soft two-partial "ding" when a new code appears, since the code itself is small to spot from the sofa. A sine with a

function ding() {

}
function showPairing(p) {

  if (pairing) resetIdle();                       // the screen stays open while a code is waiting
  if (!pairing && !was) return;

}
function checkPairing() {
  if (document.hidden) return;

  xhr.timeout = 3000;

    var d, was = pairingBlocked;
    try { d = JSON.parse(xhr.responseText); } catch (e) { return; }
    if (xhr.status !== 200) {
      pairingBlocked = d && d.pending ? 'The code cannot be shown on this screen (' + refusedText(xhr.status, d) + '). Please report this on GitHub with a photo of this screen.' : null;
      if (pairingBlocked || was) paintPairing();

}
function resetIdle() {
  clearTimeout(idleTimer);

}
// Shows how far the checks are, so a slow TV reads as working and not as stuck: how many are done, which ones are
// still open and the seconds since the checks began. Seconds that stop moving mean the page itself is blocked; a photo
// of this line says where.
var running_ = {}, doneCount_ = function () { return 0; };
function paintProgress() {
  var el = document.getElementById('sum'), open = Object.keys(running_).map(function (k) { return running_[k]; });
  if (el && step) el.textContent = 'Checking ' + doneCount_() + ' of ' + jobs.length + ' done \u00b7 ' + (open.join(', ') || 'finishing') + ' \u00b7 ' + Math.floor((Date.now() - step.since) / 1000) + ' s';
}
// Reports go out one after the other, each as it was when queued, so a late answer cannot overwrite a newer one.
function post(ms) {

  posts = sent.then(null, function () {});

}
function run() {

  var started = Date.now(), closed = false, cap;

  render(null, true);

  // time limit once, not on top of every other step's.

document.addEventListener('visibilitychange', function () { if (document.hidden && delivered) leave(); });
