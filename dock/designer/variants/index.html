<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vetro launcher variants</title>
<style>
:root{
  --bg:#0f1116;--panel:#171a22;--panel2:#1d212b;--line:#2b303c;--txt:#e9ebf0;--mut:#9aa1b0;--acc:#8fb4ff;
  --yes:#5fd08a;--part:#f0b35c;--no:#ef7a7a;
}
@media (prefers-color-scheme: light){
  :root:not([data-ui="dark"]){--bg:#eef0f4;--panel:#fff;--panel2:#f4f5f8;--line:#d7dbe3;--txt:#1b1e26;--mut:#5d6575;--acc:#2455c9;--yes:#1f8a4c;--part:#a8670a;--no:#b73a3a}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1500px;margin:0 auto;padding:24px 16px 64px}
h1{margin:0 0 4px;font-size:26px;letter-spacing:-.01em}
.lead{margin:0 0 18px;color:var(--mut);max-width:900px}
.bar{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-bottom:14px}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grp>label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-right:4px}
button{font:inherit;color:var(--txt);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}
button:hover{background:var(--panel2)}
button[aria-pressed="true"]{background:var(--txt);color:var(--bg);border-color:var(--txt)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sw{display:inline-flex;gap:0;margin-right:8px;vertical-align:-3px;border-radius:50%;overflow:hidden;width:16px;height:16px;border:1px solid rgba(128,128,128,.5)}
.sw i{flex:1}
.stagewrap{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:14px;border:1px solid var(--line);background:#000}
.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;margin-top:16px}
@media (max-width:1000px){.cols{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card h2{margin:0 0 6px;font-size:20px}
.card h3{margin:16px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.card p{margin:6px 0}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--mut);margin:2px 4px 0 0}
table{width:100%;border-collapse:collapse}
td{padding:9px 8px;border-top:1px solid var(--line);vertical-align:top}
tr:first-child td{border-top:0}
td.el{width:30%;font-weight:600}
td.lv{width:92px;white-space:nowrap}
.badge{display:inline-block;min-width:74px;text-align:center;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;border:1.5px solid currentColor}
.badge.y{color:var(--yes)}.badge.p{color:var(--part)}.badge.n{color:var(--no)}
td.why{color:var(--mut)}
.legend{font-size:13px;color:var(--mut);margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.grid{grid-template-columns:1fr}}
.cell{display:block;text-align:left;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.cell .cap{padding:9px 12px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.cell .cap span{color:var(--mut);font-weight:400}
.kbd{font-size:13px;color:var(--mut);margin-top:12px}
.kbd kbd{font:inherit;border:1px solid var(--line);border-radius:6px;padding:0 6px;background:var(--panel)}
.note{font-size:13px;color:var(--mut);margin-top:10px}

/* ===== Stage: a 1920x1080 picture scaled into its frame ===== */
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--over);
  background:var(--scene) center/cover}
.stage *{box-sizing:border-box}
.stage svg{display:block}
.stage .abs{position:absolute}
.stage .scrimB{position:absolute;left:0;right:0;bottom:0;height:480px;background:linear-gradient(to bottom,rgba(var(--shadeRGB),0),rgba(var(--shadeRGB),.62) 38%,rgba(var(--shadeRGB),.94))}
.stage .scrimT{position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(to top,rgba(var(--shadeRGB),0),rgba(var(--shadeRGB),.7))}
.chip{position:absolute;top:36px;right:64px;height:56px;padding:0 24px;border-radius:16px;display:flex;align-items:center;gap:16px;background:rgba(10,12,16,.74);border:2px solid rgba(255,255,255,.1);color:#f2f3f5;font-size:26px;white-space:nowrap}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--accent);flex:none}
.chip .sep{width:2px;height:26px;background:rgba(255,255,255,.22)}
.chip b{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.name{font-weight:700;letter-spacing:-.012em;color:var(--head);text-shadow:0 2px 14px rgba(0,0,0,.55);white-space:nowrap}
.sub{color:var(--over2);text-shadow:0 1px 8px rgba(0,0,0,.6);white-space:nowrap}
.hint{display:flex;gap:30px;font-size:22px;color:var(--over3);white-space:nowrap}
.hint span{display:inline-flex;align-items:center;gap:10px}
.key{display:inline-flex;align-items:center;height:30px;padding:0 10px;border:2px solid rgba(255,255,255,.42);border-radius:8px;font-size:17px;font-weight:700;color:#f2f3f5}
.app{--r:.16;width:var(--s);height:var(--s);border-radius:calc(var(--s)*var(--r));background:linear-gradient(150deg,var(--c1),var(--c2));display:grid;place-items:center;color:var(--fg,#fff);font-weight:800;font-size:calc(var(--s)*.4);letter-spacing:-.02em;flex:none;position:relative;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2)}
.app svg{width:52%;height:52%}
.gl{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dim{opacity:.55}

/* ===== V1 Homebar-like ===== */
.v1 .blk{position:absolute;left:96px;bottom:36px}
.v1 .nm{height:112px;display:flex;flex-direction:column;justify-content:flex-end}
.v1 .name{font-size:68px;line-height:76px}
.v1 .sub{font-size:28px;line-height:34px;height:34px}
.v1 .row{display:flex;align-items:center;gap:28px;margin-top:22px;height:152px}
.v1 .g{display:flex;align-items:center;gap:22px}
.v1 .g.in{gap:10px}.v1 .g.sy{gap:10px}
.v1 .app{--s:112px;--r:.17}
.v1 .app.on{box-shadow:0 0 0 5px var(--shade),0 0 0 9px var(--accent),0 0 70px 6px color-mix(in srgb,var(--accent) 38%,transparent)}
.v1 .pl{height:64px;min-width:112px;padding:0 18px;border-radius:15px;background:var(--base);border:2px solid var(--edge);display:flex;flex-direction:column;justify-content:center;align-items:center;color:var(--ink);line-height:1.1}
.v1 .pl b{font-size:25px;font-weight:700}
.v1 .pl small{font-size:15px;color:var(--ink3);margin-top:2px}
.v1 .pl.empty b{color:var(--dim)}
.v1 .pl.on{background:var(--accent);border-color:var(--accent);color:var(--onAccent);height:72px;box-shadow:0 0 50px 2px color-mix(in srgb,var(--accent) 40%,transparent)}
.v1 .pl.on small{color:var(--onAccent);opacity:.8}
.v1 .st{width:64px;height:64px;border-radius:15px;background:var(--base);border:2px solid var(--edge);display:grid;place-items:center;color:var(--ink);font-size:32px}
.v1 .st.on{background:var(--accent);border-color:var(--accent);color:var(--onAccent);width:72px;height:72px;box-shadow:0 0 50px 2px color-mix(in srgb,var(--accent) 40%,transparent)}
.v1 .st.big{width:112px;height:112px;border-radius:19px;font-size:48px}
.v1 .st.big.on{width:112px;height:112px;box-shadow:0 0 0 5px var(--shade),0 0 0 9px var(--accent),0 0 70px 6px color-mix(in srgb,var(--accent) 38%,transparent)}
.v1 .hint{margin-top:22px;height:30px}

/* ===== V2 glass pill ===== */
.v2 .wrp{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:flex-start}
.v2 .nm{padding-left:30px;height:106px;display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:14px}
.v2 .name{font-size:54px;line-height:60px}
.v2 .sub{font-size:25px;line-height:32px;height:32px}
.v2 .pill{height:148px;padding:0 26px;display:flex;align-items:center;gap:18px;border-radius:24px;background:linear-gradient(to bottom,color-mix(in srgb,var(--base) 88%,#fff),var(--base));border:2px solid var(--edge);box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.12)}
.v2 .app{--s:92px;--r:.16;opacity:.94;transition:none}
.v2 .app.on{--s:112px;opacity:1;transform:translateY(-4px);box-shadow:inset 0 0 0 2px rgba(255,255,255,.2),0 0 0 2px var(--ring),0 0 44px 8px color-mix(in srgb,var(--c1) 55%,transparent)}
.v2 .app.sq{background:var(--base2);color:var(--ink);box-shadow:inset 0 0 0 2px var(--edge)}
.v2 .app.sq svg{width:46%;height:46%}
.v2 .app.sq.on{box-shadow:inset 0 0 0 2px var(--edge),0 0 0 2px var(--ring),0 0 44px 8px color-mix(in srgb,var(--accent) 45%,transparent)}
.v2 .dv{width:2px;height:72px;background:var(--ink);opacity:.3;margin:0 10px}
.v2 .g{display:flex;align-items:center;gap:18px}
.v2 .g.in{gap:10px}
.v2 .op{white-space:nowrap;flex:none;height:52px;min-width:112px;padding:0 20px;border-radius:26px;border:2px solid color-mix(in srgb,var(--ink) 55%,transparent);color:var(--ink);display:grid;place-items:center;font-size:22px;font-weight:600;opacity:.9}
.v2 .op.on{background:var(--accent);border-color:var(--accent);color:var(--onAccent);opacity:1;box-shadow:0 0 36px 4px color-mix(in srgb,var(--accent) 45%,transparent)}
.v2 .op.empty{opacity:.5}
.v2 .hint{margin-top:18px;padding-left:30px;height:30px}
.v2 .chip{top:36px}

/* ===== V3 shelf ===== */
.v3 .shelf{position:absolute;left:0;right:0;bottom:-64px;height:476px;background:var(--base);border-radius:48px 48px 0 0;border:2px solid var(--edge);box-shadow:0 -14px 70px rgba(0,0,0,.4)}
.v3 .in{position:absolute;left:96px;right:96px;top:34px}
.v3 .nm{display:flex;align-items:baseline;gap:22px;height:84px}
.v3 .name{font-size:58px;line-height:76px;color:var(--ink);text-shadow:none}
.v3 .sub{font-size:28px;color:var(--accentInk);text-shadow:none;font-weight:600}
.v3 .row{display:flex;align-items:center;gap:20px;margin-top:10px;height:176px}
.v3 .g{display:flex;align-items:center;gap:20px}.v3 .g.in2{gap:10px}
.v3 .slot{width:176px;height:176px;border-radius:34px;display:grid;place-items:center;flex:none}
.v3 .slot.small{width:112px;height:176px;background:none}
.v3 .app{--s:116px;--r:.18}
.v3 .slot.on{background:var(--accent);box-shadow:0 0 56px 4px color-mix(in srgb,var(--accent) 35%,transparent)}
.v3 .slot.on .app{--s:132px}
.v3 .slot:not(.on){width:116px;height:116px;border-radius:0}
.v3 .pl{height:68px;min-width:114px;padding:0 18px;border-radius:16px;background:var(--base2);border:2px solid var(--edge);display:flex;flex-direction:column;justify-content:center;align-items:center;color:var(--ink);line-height:1.1}
.v3 .pl b{font-size:25px}.v3 .pl small{font-size:15px;color:var(--ink3)}
.v3 .pl.empty b{color:var(--dim)}
.v3 .pl.on{height:84px;background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.v3 .pl.on small{color:var(--onAccent);opacity:.8}
.v3 .st{width:68px;height:68px;border-radius:16px;background:var(--base2);border:2px solid var(--edge);display:grid;place-items:center;color:var(--ink);font-size:34px}
.v3 .st.on{width:84px;height:84px;background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.v3 .st.big{width:116px;height:116px;border-radius:22px;font-size:50px}
.v3 .st.big.on{width:176px;height:176px;border-radius:34px;font-size:70px}
.v3 .hint{position:absolute;left:0;top:322px;color:var(--ink3)}
.v3 .key{border-color:color-mix(in srgb,var(--ink) 45%,transparent);color:var(--ink)}
.v3 .chip{background:var(--base);color:var(--ink);border-color:var(--edge)}
.v3 .chip .sep{background:var(--edge)}

/* ===== V4 icons only ===== */
.v4 .row{position:absolute;left:0;right:0;bottom:150px;display:flex;justify-content:center;align-items:center;gap:20px;height:120px}
.v4 .g{display:flex;align-items:center;gap:20px}
.v4 .g+.g{margin-left:22px}
.v4 .it{position:relative;width:76px;height:76px;flex:none;display:grid;place-items:center}
.v4 .app{--s:76px;--r:.2;opacity:.88}
.v4 .sq{width:76px;height:76px;border-radius:15px;background:var(--glass);border:2px solid var(--glassEdge);color:var(--ink);display:grid;place-items:center;font-size:36px;font-weight:700}
.v4 .sq small{font-size:26px;font-weight:700}
.v4 .it.on{width:112px;height:112px;border-radius:24px;background:var(--accent);box-shadow:0 10px 40px rgba(0,0,0,.4)}
.v4 .it.on .app{opacity:1}
.v4 .it.on .sq{background:none;border:0;color:var(--onAccent);font-size:50px}
.v4 .lb{position:absolute;top:100%;margin-top:16px;left:50%;transform:translateX(-50%);font-size:28px;font-weight:600;color:var(--head);white-space:nowrap;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.v4 .lb small{display:block;text-align:center;font-size:20px;font-weight:400;color:var(--over2)}
.v4 .hint{position:absolute;left:0;right:0;bottom:30px;justify-content:center;opacity:.7;font-size:20px}
.v4 .clk{position:absolute;right:72px;top:44px;text-align:right;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.65)}
.v4 .clk b{display:block;font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.v4 .clk span{font-size:22px;opacity:.85}
.v4 .scrimB{height:340px}

/* ===== V5 expanding card ===== */
.v5 .blk{position:absolute;left:96px;bottom:36px}
.v5 .row{display:flex;align-items:center;gap:20px;height:128px}
.v5 .g{display:flex;align-items:center;gap:20px}
.v5 .it{width:96px;height:96px;border-radius:19px;flex:none;position:relative;display:grid;place-items:center}
.v5 .app{--s:96px;--r:.2;opacity:.92}
.v5 .sq{width:96px;height:96px;border-radius:19px;background:var(--base);border:2px solid var(--edge);color:var(--ink);display:grid;place-items:center;font-size:40px}
.v5 .sq.hd{flex-direction:column;gap:0;font-size:32px}
.v5 .sq.hd b{font-size:22px;line-height:1;margin-top:-2px}
.v5 .it.on{width:auto;height:128px;border-radius:28px;background:var(--base);border:3px solid var(--accent);padding:0 38px 0 14px;display:flex;align-items:center;gap:18px;box-shadow:0 14px 50px rgba(0,0,0,.45),0 0 60px 0 color-mix(in srgb,var(--accent) 28%,transparent)}
.v5 .it.on .app,.v5 .it.on .sq{width:96px;height:96px;opacity:1}
.v5 .tx{color:var(--ink);white-space:nowrap}
.v5 .tx b{display:block;font-size:34px;font-weight:700;line-height:40px;letter-spacing:-.01em}
.v5 .tx small{display:block;font-size:22px;color:var(--ink3);line-height:28px}
.v5 .hint{margin-top:24px}
.v5 .scrimB{height:380px}

/* ===== V6 two bands ===== */
.v6 .top{position:absolute;top:36px;right:64px;display:flex;gap:10px;align-items:center}
.v6 .top .chip{position:static}
.v6 .pl{height:60px;min-width:120px;padding:0 20px;border-radius:15px;background:var(--base);border:2px solid var(--edge);display:flex;flex-direction:column;justify-content:center;align-items:center;color:var(--ink);line-height:1.1}
.v6 .pl b{font-size:24px}.v6 .pl small{font-size:15px;color:var(--ink3);margin-top:2px}
.v6 .pl.empty b{color:var(--dim)}
.v6 .pl.on{height:76px;min-width:150px;background:var(--accent);border-color:var(--accent);color:var(--onAccent);box-shadow:0 8px 40px rgba(0,0,0,.45),0 0 50px 2px color-mix(in srgb,var(--accent) 40%,transparent)}
.v6 .pl.on small{color:var(--onAccent);opacity:.8}
.v6 .top .clock{margin-left:14px;height:60px}
.v6 .stat{position:absolute;top:36px;left:96px}
.v6 .stat.chip{right:auto}
.v6 .tn{position:absolute;left:96px;top:140px}
.v6 .tn .name{font-size:68px;line-height:76px}
.v6 .tn .sub{font-size:28px;line-height:34px}
.v6 .blk{position:absolute;left:96px;bottom:36px}
.v6 .nm{height:112px;display:flex;flex-direction:column;justify-content:flex-end}
.v6 .name{font-size:68px;line-height:76px}
.v6 .sub{font-size:28px;line-height:34px;height:34px}
.v6 .row{display:flex;align-items:center;gap:36px;margin-top:22px;height:164px}
.v6 .g{display:flex;align-items:center;gap:22px}.v6 .g.sy{gap:12px}
.v6 .app{--s:128px;--r:.17}
.v6 .app.on{box-shadow:0 0 0 5px var(--shade),0 0 0 9px var(--accent),0 0 70px 6px color-mix(in srgb,var(--accent) 38%,transparent)}
.v6 .st{width:80px;height:80px;border-radius:19px;background:var(--base);border:2px solid var(--edge);display:grid;place-items:center;color:var(--ink);font-size:38px}
.v6 .st.on{background:var(--accent);border-color:var(--accent);color:var(--onAccent);box-shadow:0 0 50px 2px color-mix(in srgb,var(--accent) 40%,transparent)}
.v6 .st.big{width:128px;height:128px;border-radius:22px;font-size:54px}
.v6 .st.big.on{box-shadow:0 0 0 5px var(--shade),0 0 0 9px var(--accent),0 0 70px 6px color-mix(in srgb,var(--accent) 38%,transparent);background:var(--accent)}
.v6 .hint{margin-top:22px;height:30px}
.v6 .scrimB{height:440px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
/* ---------------------------------------------------------------------------
   Vetro launcher look variants. Everything is static: a 1920x1080 picture made of
   rounded rectangles, pre-rendered images, system-font text, opacity/scale/move.
   The scene is the "sunset over the lake" picture of the Vetro dashboard preview.
   --------------------------------------------------------------------------- */
const SCENE_SVG = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1920 1080' preserveAspectRatio='xMidYMid slice'><defs><linearGradient id='s' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#101c3f'/><stop offset='.45' stop-color='#553b73'/><stop offset='.72' stop-color='#d9707a'/><stop offset='1' stop-color='#f6b26b'/></linearGradient><radialGradient id='g' cx='.5' cy='.5' r='.5'><stop offset='0' stop-color='#fff2cf' stop-opacity='.95'/><stop offset='.35' stop-color='#ffc58a' stop-opacity='.5'/><stop offset='1' stop-color='#ffc58a' stop-opacity='0'/></radialGradient><linearGradient id='w' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#f0a26c'/><stop offset='1' stop-color='#1a2547'/></linearGradient></defs><rect width='1920' height='1080' fill='url(#s)'/><circle cx='1330' cy='640' r='420' fill='url(#g)'/><circle cx='1330' cy='640' r='64' fill='#fff0c9'/><path d='M0 690 220 520 420 640 640 470 880 650 1080 560 1290 690 1500 540 1740 660 1920 590V760H0z' fill='#42375f'/><path d='M0 760 180 640 400 740 640 620 900 760 1160 650 1420 770 1680 670 1920 740V800H0z' fill='#26274a'/><rect y='780' width='1920' height='300' fill='url(#w)'/><rect x='1250' y='790' width='160' height='6' rx='3' fill='#ffe3b3' opacity='.7'/><rect x='1280' y='820' width='100' height='5' rx='2' fill='#ffe3b3' opacity='.45'/><rect x='1300' y='850' width='60' height='4' rx='2' fill='#ffe3b3' opacity='.3'/><path d='M0 900 0 1080H1920V920C1700 880 1500 930 1250 900 900 860 600 930 0 900z' fill='#0d1530' opacity='.55'/></svg>`;
document.documentElement.style.setProperty('--scene', 'url("data:image/svg+xml;utf8,' + encodeURIComponent(SCENE_SVG) + '")');

/* ---------- colour helpers and themes (two colours: accent + base, like Homebar) ---------- */
const H = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const x = H(a), y = H(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
const lum = h => { const [r, g, b] = H(h); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
const THEMES = [
  { id: 'vetro',      name: 'Vetro',      mode: 'dark',  accent: '#E2EDFF', base: '#2A3346' },
  { id: 'lime',       name: 'Lime',       mode: 'dark',  accent: '#B6FF2E', base: '#1F2329' },
  { id: 'lagoon',     name: 'Lagoon',     mode: 'dark',  accent: '#D6FFCB', base: '#0B3A3E' },
  { id: 'terracotta', name: 'Terracotta', mode: 'light', accent: '#E26F4A', base: '#FFFCF4' },
  { id: 'cobalt',     name: 'Cobalt',     mode: 'light', accent: '#1D61F3', base: '#F1F4F9' },
  { id: 'cherry',     name: 'Cherry',     mode: 'light', accent: '#FF173D', base: '#F9DEDF' },
];
function themeStyle(t) {
  const light = lum(t.base) > 0.6, A = t.accent;
  const v = {
    accent: A, onAccent: lum(A) > 0.6 ? '#0b0c0e' : '#ffffff', accentInk: light ? mix(A, '#000000', .15) : A,
    base: t.base, base2: light ? mix(t.base, '#000000', .06) : mix(t.base, '#ffffff', .09),
    edge: light ? 'rgba(20,22,26,.16)' : 'rgba(255,255,255,.16)',
    ink: light ? '#14161a' : '#f2f3f5', ink3: light ? '#5f6672' : '#a3a8b2', dim: light ? '#9aa0aa' : '#80858f',
    shade: mix(t.base, '#000000', .86), ring: light ? '#14161a' : '#ffffff',
    head: '#ffffff', over: '#f2f3f5', over2: '#d6d9de', over3: '#b3b8c2',
    glass: light ? 'rgba(255,255,255,.72)' : 'rgba(255,255,255,.14)', glassEdge: light ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.22)',
  };
  const s = H(v.shade);
  let css = '--shadeRGB:' + s.join(',') + ';';
  for (const k in v) css += '--' + k + ':' + v[k] + ';';
  // glass squares of V4 carry dark ink on light themes, light ink on dark themes
  return css;
}

function model(screen) {
  const list = screen === 'system' ? SYS : [...APPS, ...INPUTS, ...MORE];
  const cur = list.find(x => x.id === SEL[screen]);
  const title = cur.k === 'in' ? { name: cur.name, sub: cur.dev ? cur.dev : 'No device detected' } : { name: cur.name, sub: '' };
  return { screen, list, cur, title, apps: screen === 'system' ? [] : APPS, inputs: screen === 'system' ? [] : INPUTS, more: screen === 'system' ? SYS : MORE };
}
const hintsHtml = (screen, cls) => '<div class="hint ' + (cls || '') + '">' + HINTS[screen].map(h => '<span><i class="key">' + h[0] + '</i>' + h[1] + '</span>').join('') + '</div>';
const on = (m, it) => it.id === m.cur.id ? ' on' : '';
const appTile = (it, extra) => '<div class="app' + (extra || '') + '" style="--c1:' + it.c[0] + ';--c2:' + it.c[1] + (it.fg ? ';--fg:' + it.fg : '') + '">' + (it.g ? gl(it.g) : it.t) + '</div>';

/* ---------- the six variants ---------- */
const V = [];

// 1 -- Homebar-like: a bare row on the picture, big name above, chip top right
V[0] = m => {

// 4 -- icons only, focus fills the tile, name only under the selected one
V[3] = m => {
  const item = it => {
    const isOn = it.id === m.cur.id;
    let body;
    if (it.k === 'app') body = appTile(it);
    else if (it.k === 'in') body = '<div class="sq"><small>' + it.n + '</small></div>';
    else body = '<div class="sq">' + gl(it.g) + '</div>';
    if (it.k === 'in' && isOn) body = '<div class="sq">' + gl('hdmi') + '</div>';
    const lb = isOn ? '<div class="lb">' + m.title.name + (m.title.sub ? '<small>' + m.title.sub + '</small>' : '') + '</div>' : '';
    return '<div class="it' + (isOn ? ' on' : '') + '">' + body + lb + '</div>';
  };
  const row = m.screen === 'system'
    ? '<div class="g">' + SYS.map(item).join('') + '</div>'
    : '<div class="g">' + APPS.map(item).join('') + '</div><div class="g">' + INPUTS.map(item).join('') + '</div><div class="g">' + MORE.map(item).join('') + '</div>';
  return '<div class="scrimB"></div><div class="clk"><b>21:42</b><span>Live TV 12</span></div><div class="row">' + row + '</div>' + hintsHtml(m.screen);
};

// 5 -- expanding card: the selected icon opens into a card with its name
V[4] = m => {
  const item = it => {
    const isOn = it.id === m.cur.id;
    let body, sub;
    if (it.k === 'app') { body = appTile(it); sub = 'Open'; }
    else if (it.k === 'in') { body = '<div class="sq hd">' + gl('hdmi') + '<b>' + it.n + '</b></div>'; sub = it.dev || 'No device detected'; }
    else { body = '<div class="sq">' + gl(it.g) + '</div>'; sub = it.id === 'system' ? 'TV, launcher, network' : 'Open'; }
    if (!isOn) return '<div class="it">' + body + '</div>';
    return '<div class="it on">' + body + '<div class="tx"><b>' + it.name + '</b><small>' + sub + '</small></div></div>';
  };
  const row = m.screen === 'system'
    ? '<div class="g">' + SYS.map(item).join('') + '</div>'
    : '<div class="g">' + APPS.map(item).join('') + '</div><div class="g">' + INPUTS.map(item).join('') + '</div><div class="g">' + MORE.map(item).join('') + '</div>';
  return '<div class="scrimB"></div><div class="chip">' + CHIP + '</div><div class="blk"><div class="row">' + row + '</div>' + hintsHtml(m.screen) + '</div>';

  const topOnly = m.screen === 'system' ? '<div class="top"><div class="chip clock"><b>21:42</b></div></div>' : top;
  const bottom = m.screen === 'system'

  return '<div class="scrimB"></div>' + (m.screen === 'system' ? '' : '<div class="scrimT"></div>') +
    '<div class="chip stat">' + '<i></i><span>Live TV 12 &middot; Evening Light</span></div>' + topOnly +
    (srcFocus ? '<div class="tn"><div class="name">' + m.title.name + '</div><div class="sub">' + m.title.sub + '</div></div>' : '') +
    '<div class="blk"><div class="nm">' + (srcFocus ? '' : '<div class="name">' + m.title.name + '</div><div class="sub">' + m.title.sub + '</div>') + '</div>' +
    '<div class="row' + (srcFocus ? ' dim' : '') + '">' + bottom + '</div>' + hints + '</div>';
};

/* ---------- mounting ---------- */
function stageHtml(vi, screen, ti) {
  return '<div class="stage v' + (vi + 1) + '" style="' + themeStyle(THEMES[ti]) + '">' + V[vi](model(screen)) + '</div>';
}
function mountStage(host, vi, screen, ti) {
  host.innerHTML = stageHtml(vi, screen, ti);
  const st = host.firstChild;
  const fit = () => { const k = host.clientWidth / 1920; st.style.transform = 'scale(' + k + ')'; };
  fit();
  if (host._ro) host._ro.disconnect();
  host._ro = new ResizeObserver(fit); host._ro.observe(host);
}

const S = { v: 0, screen: 'home', t: 0, view: 'single', stage: false };
(function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('v')) S.v = Math.max(0, Math.min(5, +p.get('v') - 1 || 0));
  if (p.has('s') && SEL[p.get('s')]) S.screen = p.get('s');
  if (p.has('t')) { const i = THEMES.findIndex(x => x.id === p.get('t')); if (i >= 0) S.t = i; }
  if (p.get('view') === 'all') S.view = 'all';
  if (p.has('stage')) S.stage = true;
})();
function writeHash() {
  const p = new URLSearchParams({ v: S.v + 1, s: S.screen, t: THEMES[S.t].id });
  if (S.view === 'all') p.set('view', 'all');
  try { history.replaceState(null, '', '#' + p.toString()); } catch (e) { }
}
const btn = (label, pressed, attrs) => '<button type="button" aria-pressed="' + pressed + '" ' + attrs + '>' + label + '</button>';
const badge = l => '<span class="badge ' + l + '">' + (l === 'y' ? 'Sì' : l === 'p' ? 'Parziale' : 'No') + '</span>';

function render() {
  const app = document.getElementById('app');
  if (S.stage) {
    document.body.style.margin = '0'; document.body.style.background = '#000000';
    app.className = ''; app.style.cssText = 'position:fixed;inset:0';
    app.innerHTML = '<div class="stagewrap" id="host" style="width:100vw;height:100vh;border:0;border-radius:0;aspect-ratio:auto"></div>';
    const host = document.getElementById('host');
    host.innerHTML = stageHtml(S.v, S.screen, S.t);
    const st = host.firstChild;
    const fit = () => { const k = Math.min(innerWidth / 1920, innerHeight / 1080); st.style.transform = 'scale(' + k + ')'; };
    fit(); addEventListener('resize', fit);
    return;
  }
  const info = INFO[S.v];
  let h = '<h1>Vetro launcher &mdash; varianti grafiche</h1>' +
    '<p class="lead">Sei proposte statiche per confrontare il look del launcher sulla TV Samsung Q80A, sopra lo stesso sfondo ("tramonto sul lago"). Tutto è disegnato solo con ciò che il dock sa fare: rettangoli arrotondati, immagini PNG con alpha pre-renderizzate, testo con il font di sistema, animazioni di scala, spostamento e opacità. Le icone delle app sono segnaposto con le iniziali (sulla TV ci sono quelle vere di Samsung). Il testo dentro la scena è l\'interfaccia del launcher, in inglese.</p>';
  h += '<div class="bar"><div class="grp"><label>Vista</label>' + btn('Una variante', S.view === 'single', 'data-view="single"') + btn('Confronta tutte', S.view === 'all', 'data-view="all"') + '</div>' +
    '<div class="grp"><label>Schermata</label>' + SCREENS.map(s => btn(s[1], S.screen === s[0], 'data-screen="' + s[0] + '"')).join('') + '</div>' +
    '<div class="grp"><label>Tema</label>' + THEMES.map((t, i) => btn('<span class="sw"><i style="background:' + t.base + '"></i><i style="background:' + t.accent + '"></i></span>' + t.name, S.t === i, 'data-theme="' + i + '"')).join('') + '</div></div>';
  if (S.view === 'single') {
    h += '<div class="bar"><div class="grp"><label>Variante</label>' + INFO.map((x, i) => btn((i + 1) + ' ' + x.name, S.v === i, 'data-v="' + i + '"')).join('') + '</div></div>';
    h += '<div class="stagewrap" id="host"></div>';
    h += '<p class="kbd">Tasti: <kbd>1</kbd>&ndash;<kbd>6</kbd> variante, <kbd>H</kbd> Home, <kbd>S</kbd> Source, <kbd>Y</kbd> System, <kbd>T</kbd> tema successivo, <kbd>F</kbd> schermo intero della sola scena. Lo stato è nell\'indirizzo (#v=3&amp;s=system&amp;t=lime).</p>';
    h += '<div class="cols"><div class="card"><h2>' + (S.v + 1) + ' &middot; ' + info.name + '</h2><p><b>' + info.short + '</b></p><p>' + info.desc + '</p><h3>Perché questa</h3><p>' + info.why + '</p><p>' + info.tags.map(t => '<span class="tag">' + t + '</span>').join('') + '</p></div>';
    h += '<div class="card"><h2>Fattibilità sul dock</h2><p class="legend"><b>Sì</b> = con le primitive già presenti (rettangoli, PNG alpha, testo di sistema, scala/opacità). <b>Parziale</b> = fattibile ma con lavoro in più o con un dato che il dock non ha. <b>No</b> = non realizzabile (sfocatura, filtri live, saturazione dinamica).</p><table>' +
      info.f.map(r => '<tr><td class="el">' + r[0] + '</td><td class="lv">' + badge(r[1]) + '</td><td class="why">' + r[2] + '</td></tr>').join('') + '</table></div></div>';
  } else {
    h += '<div class="grid">' + INFO.map((x, i) => '<button type="button" class="cell" data-pick="' + i + '"><div class="stagewrap" data-mini="' + i + '" style="border:0;border-radius:0"></div><div class="cap">' + (i + 1) + ' &middot; ' + x.name + '<span>' + x.short + '</span></div></button>').join('') + '</div>' +
      '<p class="note">Clic su una scena per aprire la variante con la sua scheda di fattibilità.</p>';
  }
  app.innerHTML = h;
  if (S.view === 'single') mountStage(document.getElementById('host'), S.v, S.screen, S.t);
  else app.querySelectorAll('[data-mini]').forEach(el => mountStage(el, +el.dataset.mini, S.screen, S.t));
  writeHash();
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.view) S.view = d.view; else if (d.screen) S.screen = d.screen; else if (d.theme) S.t = +d.theme; else if (d.v) S.v = +d.v;
  else if (d.pick) { S.v = +d.pick; S.view = 'single'; } else return;
  render();
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k >= '1' && k <= '6') S.v = +k - 1;
  else if (k === 'h') S.screen = 'home'; else if (k === 's') S.screen = 'sources'; else if (k === 'y') S.screen = 'system';
  else if (k === 't') S.t = (S.t + 1) % THEMES.length;
  else if (k === 'f') { S.stage = !S.stage; if (!S.stage) { document.body.style.cssText = ''; document.getElementById('app').style.cssText = ''; document.getElementById('app').className = 'wrap'; } }
  else if (k === 'escape' && S.stage) { S.stage = false; document.body.style.cssText = ''; document.getElementById('app').style.cssText = ''; document.getElementById('app').className = 'wrap'; }
  else return;
  render();
});
document.getElementById('app').className = 'wrap';
render();
</script>
